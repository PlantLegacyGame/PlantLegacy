<!doctype html>
<!-- The entry step starts at the title, before any script has run: the stylesheet
     hides the 3D canvas for every step but the world, and without a value from the
     very first paint the game's environment showed for the second between the
     canvas appearing and the entry screen mounting. main.ts overwrites this on
     every render. -->
<html lang="en" data-pl-entry-step="title">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
    <meta name="server-origin" content="" />
    <base href="/PlantLegacy/" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%233a5a2a'/><path d='M50 78 C50 55 38 40 22 34 C30 52 38 64 50 78 Z' fill='%238fce6a'/><path d='M50 78 C50 52 62 36 80 30 C72 50 62 64 50 78 Z' fill='%2366a84a'/><rect x='47' y='62' width='6' height='22' rx='3' fill='%235c3d22'/></svg>" />
    <title>Plant Legacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    </style>
    <script>
      // Immediately block all browser page zoom shortcuts (Ctrl+Plus, Ctrl+Minus, Ctrl+0, Ctrl+Wheel, trackpad pinch)
      // so the webpage layout is never scaled or distorted by the browser.
      function preventBrowserZoom(e) {
        if (e.ctrlKey || e.metaKey) {
          if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_' || e.key === '0') {
            e.preventDefault();
          }
        }
      }
      window.addEventListener('keydown', preventBrowserZoom, { passive: false, capture: true });
      window.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });
      window.addEventListener('gesturestart', (e) => { e.preventDefault(); }, { passive: false, capture: true });
      window.addEventListener('gesturechange', (e) => { e.preventDefault(); }, { passive: false, capture: true });
      window.addEventListener('gestureend', (e) => { e.preventDefault(); }, { passive: false, capture: true });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
