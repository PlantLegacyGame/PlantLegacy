<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
    <meta name="server-origin" content="" />
    <base href="/PlantLegacy/" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
    <title>Plant Legacy</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    </style>
    <script>
      // Immediately block all browser page zoom shortcuts (Ctrl+Plus, Ctrl+Minus, Ctrl+0, Ctrl+Wheel, trackpad pinch)
      // so the webpage layout is never scaled or distorted by the browser.
      function preventBrowserZoom(e) {
        if (e.ctrlKey || e.metaKey) {
          if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_' || e.key === '0') {
            e.preventDefault();
          }
        }
      }
      window.addEventListener('keydown', preventBrowserZoom, { passive: false, capture: true });
      window.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });
      window.addEventListener('gesturestart', (e) => { e.preventDefault(); }, { passive: false, capture: true });
      window.addEventListener('gesturechange', (e) => { e.preventDefault(); }, { passive: false, capture: true });
      window.addEventListener('gestureend', (e) => { e.preventDefault(); }, { passive: false, capture: true });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
